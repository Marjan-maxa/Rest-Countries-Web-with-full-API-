<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Details</title>
    <script src="country.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="country.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <h2 class="title">Where in the World?</h2>
        <p><i class="fa-regular fa-moon"></i>&nbsp;Dark Mode</p>
      </div>
    </header>

    <main>
      <span class="back-btn" onclick="history.back()">
        <i class="fa-solid fa-arrow-left"></i>&nbsp;Back
      </span>

      <div class="country-detais">
        <img src="" alt="" />
        <div class="text-details">
          <h1>Mexico</h1>
          <div class="details">
            <p><b>Native Name:</b> <span class="native-Name"></span></p>
            <p><b>Population:</b><span class="population-Number"></span></p>
            <p><b>Region:</b> <span class="region-Name"></span></p>
            <p><b>Sub Region:</b> <span class="subregion-Name"></span></p>
            <p><b>Capital:</b><span class="capital-Name"></span></p>
            <p><b>Top Level Domain:</b> <span class="todomain-Name"></span></p>
            <p><b>Currencies:</b> <span class="currencies-Name"> </span></p>
            <p><b>Languages:</b> <span class="language-Name"></span></p>
          </div>

          <div class="border-section"><b>Border Countries:</b>&nbsp;</div>
        </div>
      </div>
    </main>
  </body>
</html>
